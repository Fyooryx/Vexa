name: Vexa merge notifier

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  congratulate:
    name: Notify merged Vexa change
    runs-on: ubuntu-latest
    steps:
      - name: Find merged pull request
        id: merged-pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: context.sha,
            });
            const mergedPr = prs.find((pr) => pr.merged_at);
            if (!mergedPr) {
              core.setOutput('merged', 'false');
              return;
            }
            core.setOutput('merged', 'true');
            core.setOutput('number', String(mergedPr.number));
            core.setOutput('title', mergedPr.title);

      - name: Post merge notification
        if: steps.merged-pr.outputs.merged == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const number = Number('${{ steps.merged-pr.outputs.number }}');
            const title = '${{ steps.merged-pr.outputs.title }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: '🎉 Vexa change merged: **' + title + '**',
            });
